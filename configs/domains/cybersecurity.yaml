domain:
  name: cybersecurity
  display_name: "Cybersecurity & Threat Intelligence"
  version: "1.0.0"
  compliance_frameworks: [SOC2, ISO-27001, NIST-CSF, NIS2, MITRE-ATT&CK]
  primary_tasks: [anomaly, classification, graphs, nlp, forecasting]
  key_metrics: [auc_pr, recall_at_1pct_fpr, f1_score, mttd_seconds, false_positive_rate]
  default_cv_strategy: time_series_split
