domain:
  name: manufacturing
  display_name: "Manufacturing & Industry 4.0/5.0"
  version: "1.0.0"
  compliance_frameworks: [ISO-9001, ISO-27001, IEC-62443, OSHA]
  primary_tasks: [anomaly, survival, forecasting, optimization, computer_vision, simulation]
  key_metrics: [f1_score, recall, false_alarm_rate, rul_rmse, oee_score, c_index]
  default_cv_strategy: time_series_split
  drift_sensitivity: high
