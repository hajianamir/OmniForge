services:
  omniforge-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: omniforge-enterprise:2.0.0
    container_name: omniforge-api
    command: ["api"]
    env_file:
      - ../.env.example
    environment:
      OMNIFORGE_ENVIRONMENT: production
      OMNIFORGE_API_HOST: 0.0.0.0
      OMNIFORGE_API_PORT: 8000
      OMNIFORGE_WORKSPACE_DIR: /var/lib/omniforge
    ports:
      - "8000:8000"
    volumes:
      - omniforge_workspace:/var/lib/omniforge
      - ../configs:/app/configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  omniforge-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: omniforge-enterprise:2.0.0
    container_name: omniforge-ui
    command: ["ui"]
    depends_on:
      omniforge-api:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      OMNIFORGE_ENVIRONMENT: production
      OMNIFORGE_UI_HOST: 0.0.0.0
      OMNIFORGE_UI_PORT: 8501
      OMNIFORGE_API_BASE_URL: http://omniforge-api:8000
      OMNIFORGE_WORKSPACE_DIR: /var/lib/omniforge
    ports:
      - "8501:8501"
    volumes:
      - omniforge_workspace:/var/lib/omniforge
      - ../configs:/app/configs:ro
    restart: unless-stopped

volumes:
  omniforge_workspace:
    driver: local
