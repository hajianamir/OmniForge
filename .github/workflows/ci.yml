name: OmniForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,ui,reporting,data,forecasting]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy type check
        run: mypy src/omniforge
      - name: Run pytest with coverage
        run: |
          set +e
          pytest -q tests --cov=omniforge --cov-report=term-missing --tb=short > /tmp/pytest-output.log 2>&1
          status=$?
          set -e
          {
            echo '## pytest output (exit code' "$status" ')'
            echo '<details><summary>full log</summary>'
            echo '```'
            tail -c 60000 /tmp/pytest-output.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pytest-output.log
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)|failed, .*passed|error" /tmp/pytest-output.log | tail -40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-500)
              echo "::error title=pytest::$clean"
            done
            tail -c 3000 /tmp/pytest-output.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-2800 | while IFS= read -r line; do echo "::error title=pytest-tail::$line"; done
          fi
          exit "$status"
