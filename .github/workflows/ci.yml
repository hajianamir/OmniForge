name: OmniForge CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,ui,reporting,data,forecasting]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy type check
        run: mypy src/omniforge
      - name: Run pytest with coverage
        run: |
          set +e
          pytest -q tests --cov=omniforge --cov-report=term-missing --tb=short > /tmp/pytest-output.log 2>&1
          status=$?
          set -e
          cat /tmp/pytest-output.log
          if [ "$status" -ne 0 ]; then
            {
              echo '## pytest output (exit code' "$status" ')'
              echo '<details><summary>full log</summary>'
              echo '```'
              tail -c 60000 /tmp/pytest-output.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAILED|ERROR)|failed, .*passed|error" /tmp/pytest-output.log | tail -40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-500)
              echo "::error title=pytest::$clean"
            done
            tail -c 3000 /tmp/pytest-output.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-2800 | while IFS= read -r line; do echo "::error title=pytest-tail::$line"; done
          fi
          exit "$status"
      - name: Verify SDK resources and typing from the installed release
        run: |
          set -euo pipefail
          release_dir=$(mktemp -d)
          python -m pip install build
          python -m build --outdir "$release_dir/dist"
          python -m pip install --no-deps --force-reinstall "$release_dir"/dist/*.whl
          cp scripts/verify_installed_sdk.py "$release_dir/"
          cd "$release_dir"
          python -I verify_installed_sdk.py
          python -m mypy --strict --cache-dir "$release_dir/mypy-cache" verify_installed_sdk.py
  lock-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify hash-pinned runtime lock installs cleanly
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: Smoke-import the locked dependency set
        run: |
          python -c "import omniforge, fastapi, pandas, sklearn, numpy, duckdb, cryptography, pydantic; print('requirements.lock installs and imports cleanly')"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (locked)
        working-directory: frontend
        run: npm ci
      - name: Type-check & build SPA (tsc + vite) into src/omniforge/ui/static_app
        working-directory: frontend
        run: npm run build
      - name: Fail if committed static_app is stale vs frontend source
        run: |
          if [ -n "$(git status --porcelain -- src/omniforge/ui/static_app)" ]; then
            git status --short -- src/omniforge/ui/static_app
            git --no-pager diff --stat -- src/omniforge/ui/static_app
            echo "::error title=static_app stale::Committed src/omniforge/ui/static_app does not match frontend/ source. Run 'cd frontend && npm ci && npm run build' and commit the rebuilt assets."
            exit 1
          fi
      - name: Install Chromium for browser regressions
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser chart regressions
        working-directory: frontend
        run: npm run test:browser -- tests/browser/studio-charts.spec.ts --workers=2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,ui,reporting,data,forecasting]"
      - name: Run live Workbench browser regressions
        run: |
          set -euo pipefail
          runtime=$(mktemp -d)
          export OMNIFORGE_KEY_DIR="$runtime/keys"
          export OMNIFORGE_PATHS__WORKSPACE_DIR="$runtime/workspace"
          export OMNIFORGE_PATHS__AUDIT_LOG_PATH="$runtime/workspace/audit.jsonl"
          export OMNIFORGE_API__RATE_LIMIT_PER_MINUTE=0
          export OMNIFORGE_API_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          omniforge ui --host 127.0.0.1 --port 8501 > "$runtime/service.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/health >/dev/null
          export OMNIFORGE_BROWSER_API_KEY="$OMNIFORGE_API_KEY"
          export PLAYWRIGHT_BASE_URL=http://127.0.0.1:8501
          npm --prefix frontend run test:browser -- tests/browser/live-workspace.spec.ts --workers=1
      # tests/e2e also runs inside the main pytest matrix; this job additionally verifies
      # the SPA builds from lock-pinned sources and that the served assets are fresh.
      - name: Run e2e suite (API, CLI, workbench SPA)
        run: pytest -q tests/e2e --tb=short
  latency-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,ui,reporting,data,forecasting]"
      - name: Enforce latency & memory budgets (p95)
        run: python scripts/latency_budget_benchmark.py
  docker-registry-persistence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the hash-locked image
        run: docker build -f docker/Dockerfile -t omniforge:ci-registry .
      - name: Replace the container and verify registry data and fairness evidence
        run: python3 scripts/smoke_docker_registry.py omniforge:ci-registry
      - name: Verify the Python lock and inventory Debian packages
        run: python3 scripts/generate_sbom.py --image omniforge:ci-registry --include-os --out docker-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: docker-sbom-${{ matrix.architecture }}
          path: docker-sbom.cdx.json
          if-no-files-found: error
